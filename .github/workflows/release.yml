name: Release

# A version bump in package.json pushed to main = a release: publish to npm
# (trusted publishing over OIDC — no token, no OTP) and create the vX.Y.Z
# tag + GitHub release. Same pattern as the LW plugins: never tag by hand.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'package.json'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm CLI 11.5.1+.
      - run: npm install -g npm@^11.5.1

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Skip if already on npm
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install, lint, test, build
        if: steps.check.outputs.exists == 'false'
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        # --ignore-scripts: prepublishOnly would re-run tests + build, done above.
        run: npm publish --access public --ignore-scripts

      # Runs even when npm already has the version, so a re-run (or a manual
      # workflow_dispatch) backfills a missing tag/release. Idempotent.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0
          NOTES=$(awk -v v="$VERSION" '$0 ~ "^## \\["v"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes "${NOTES:-See CHANGELOG.md}"
